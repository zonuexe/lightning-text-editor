[package]
name = "inzm-tauri"
version = "0.1.0"
description = "Lightning Text Editor - Rust + Tauri Desktop App"
edition = "2021"

[lib]
name = "inzm_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
